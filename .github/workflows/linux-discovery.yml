name: Weekly Linux Discovery

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Discover Linux distributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/discover-linux.mjs

      - name: Commit catalog updates
        run: |
          git config user.name 'OSPulse Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/auto-linux.json data/discovery-candidates.json
          if git diff --cached --quiet; then
            echo 'No catalog changes.'
          else
            git commit -m 'chore(data): weekly Linux discovery update'
            git push
          fi
